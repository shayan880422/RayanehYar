
name: Build RayanehYar APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RayanehYar-Android-Demo-Source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q RayanehYar-Android-Demo-Source.zip -d project

      - name: Build debug APK
        run: gradle --no-daemon -p project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RayanehYar-debug-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
